<!doctype html>
<html lang="en">
<head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>

    <div class="nav-eyebrow">YOUR WORKSPACE</div>
    <nav id="primary-nav"></nav>
    <div class="nav-eyebrow session-nav-label">STUDY SESSIONS <span>19</span></div>
    <nav id="section-nav" aria-label="Rubric sections"></nav>
    <div class="sidebar-bottom"><span class="save-dot"></span><div>Made for your WiSe game<small>Progress saved in this browser</small></div></div>

  <div class="page-shell">
    <header class="topbar"><div class="topbar-left"><button id="menu-button" class="icon-button mobile-only" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button><span id="breadcrumb">Study room <span>/</span> Overview</span></div><div class="topbar-actions"><span class="saved-label" id="save-label">Saved on this device</span><button class="icon-button" id="search-button" aria-label="Search all questions">⌕</button><a class="avatar" href="#progress" aria-label="Your progress">E</a></div></header>
